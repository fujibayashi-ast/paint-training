# CI ワークフロー雛形
# プロジェクトの言語・ビルドツールに応じて steps を書き換えること
# - Node (yarn): setup-node → yarn install --frozen-lockfile → yarn lint / typecheck / test
# - Python (uv): setup-python → uv sync → ruff check / mypy / pytest
# - Go: setup-go → go vet / go test
#
# 使わない場合はこのファイルごと削除してよい

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
